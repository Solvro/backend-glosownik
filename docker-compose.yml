version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: backend-glosownik
    restart: always
    ports:
      - "27017:27017"
    # Uruchamiamy MongoDB z flagą włączającą Replica Set o nazwie "rs0"
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo_data:/data/db
    # Ten healthcheck automatycznie zainicjuje Replica Set po starcie kontenera
    healthcheck:
      test: test $$(echo "rs.initiate({_id:'rs0',members:[{_id:0,host:\"localhost:27017\"}]}).ok || rs.status().ok" | mongosh --port 27017 --quiet) -eq 1
      interval: 10s
      start_period: 30s

volumes:
  mongo_data:
